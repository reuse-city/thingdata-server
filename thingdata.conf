# Default server configuration for thingdata-server

# HTTP server block: Redirects all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;

    # Replace with your domain name or subdomain
    server_name your_domain_or_subdomain.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block: Proxies requests to the thingdata-server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Replace with your domain name or subdomain
    server_name your_domain_or_subdomain.com;

    # SSL configuration
    # Replace with the actual paths to your SSL certificate and private key
    # ssl_certificate /path/to/your/fullchain.pem;
    # ssl_certificate_key /path/to/your/privkey.pem;

    # Include recommended SSL/TLS settings (optional, but recommended)
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers off;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    # ssl_ecdh_curve secp384r1; # Requires nginx >= 1.1.0
    # ssl_session_timeout  10m;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_tickets off; # Requires nginx >= 1.5.9
    # ssl_stapling on; # Requires nginx >= 1.3.7
    # ssl_stapling_verify on; # Requires nginx => 1.3.7
    # resolver 8.8.8.8 8.8.4.4 valid=300s; # Use Google's public DNS resolvers
    # resolver_timeout 5s;
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    # add_header X-Frame-Options DENY;
    # add_header X-Content-Type-Options nosniff;
    # add_header X-XSS-Protection "1; mode=block";

    location / {
        proxy_pass http://localhost:3000; # Assuming thingdata-server runs on port 3000
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if your thingdata-server uses WebSockets)
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }

    # Optional: You can add custom error pages
    # error_page 500 502 503 504 /50x.html;
    # location = /50x.html {
    #     root /usr/share/nginx/html;
    # }
}
